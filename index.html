  <style>
    :root {
      /* Rich warm dark brown color scheme */
      --bg: #2d1e18;          /* Main dark wood background */
      --card-bg: #3d2b22;     /* Medium brown for rows & buttons */
      --accent: #eab308;      /* Warm golden accent for active tab/highlights */
      --text: #fef3c7;        /* Soft warm cream text */
      --text-muted: #a89280;  /* Muted warm grey-brown text */
      --border: #543a2e;      /* Border brown */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .preference-table {
      max-width: 1400px; /* Increased from 950px */
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .food-row {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 32px; /* Increased horizontal padding */
      gap: 30px;
      width: 100%;
      box-sizing: border-box;
    }

    .food-sidebar {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 140px;
      min-width: 140px;
      border-right: 1px solid var(--border);
      padding-right: 20px;
    }

    .food-sidebar img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 12px; /* Uniform square with small rounded corner */
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .food-sidebar span {
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
      font-size: 1rem;
    }

    .character-list {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      flex-grow: 1;
    }

    .character-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90px;
    }

    .character-card img {
      width: 85px;
      height: 85px;
      object-fit: cover;
      border-radius: 12px; /* Matches food photo style */
      border: 2px solid var(--border);
    }

    .character-card.target img {
      border: 2px solid var(--accent);
    }

    .character-card span {
      margin-top: 8px;
      font-size: 0.9rem;
      text-align: center;
    }

    .no-chars {
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>

      centurio: { goat: null, scallop: null, pumpkin: null, ham: null, glazed: null, pear: null, lobster: null, meat: null, fish: null, sticks: null, soup: null, medazine: null },
      anna: { goat: null, scallop: null, pumpkin: null, ham: null, glazed: null, pear: null, lobster: null, meat: null, fish: null, sticks: null, soup: null, medazine: null },
      troy: { goat: null, scallop: null, pumpkin: null, ham: null, glazed: null, pear: null, lobster: null, meat: null, fish: null, sticks: null, soup: null, medazine: null },
      honghua: { goat: null, scallop: null, pumpkin: null, ham: null, glazed: null, pear: null, lobster: null, meat: null, fish: null, sticks: null, soup: null, medazine: null }
    };

    
    // -------------------------------------------------------------------------
    // 2. RENDERING LOGIC
    // -------------------------------------------------------------------------
    function renderTable(targetScore) {
      const container = document.getElementById("table-container");
      container.innerHTML = "";

      FOODS.forEach(food => {
        // Create food row
        const row = document.createElement("div");
        row.className = "food-row";

        // Food Sidebar (Left Column)
        const foodSidebar = `
          <div class="food-sidebar">
            <img src="${food.img}" alt="${food.name}">
            <span>${food.name}</span>
          </div>
        `;

        // Find matching characters
        const matchingChars = CHARACTERS.filter(char => RATINGS[char.id]?.[food.id] === targetScore);

        // Build character cards HTML
        let charListHTML = `<div class="character-list">`;
        if (matchingChars.length > 0) {
          matchingChars.forEach(char => {
            charListHTML += `
              <div class="character-card target">
                <img src="${char.img}" alt="${char.name}">
                <span>${char.name}</span>
              </div>
            `;
          });
        } else {
          charListHTML += `<span class="no-chars">(None)</span>`;
        }
        charListHTML += `</div>`;

        row.innerHTML = foodSidebar + charListHTML;
        container.appendChild(row);
      });
    }

    function switchTab(score, btnElement) {
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      btnElement.classList.add("active");
      renderTable(score);
    }

    // Initial render for "Loves" (Score 4)
    renderTable(4);
  </script>
